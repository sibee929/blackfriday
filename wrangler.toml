# Cloudflare Pages / Workers Deployment-Konfiguration für mrkshi.com
name = "mrkshi-storefront"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

[vars]
APP_URL = "https://www.mrkshi.com"
# Sensible Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, N8N_WEBHOOK_URL,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, META_CAPI_ACCESS_TOKEN, ADMIN_PASSCODE)
# ausschließlich über `wrangler secret put` bzw. Cloudflare Dashboard Secrets setzen.
